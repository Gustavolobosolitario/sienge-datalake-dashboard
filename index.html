<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Indicadores agregados de compras e notas fiscais do Data Lake Sienge">
  <title>Compras e Notas | Data Lake Sienge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div><span class="eyebrow">DATA LAKE SIENGE</span><h1>Compras e notas fiscais</h1></div>
    <p id="updated">Carregando dados...</p>
  </header>
  <main>
    <section class="metrics" aria-label="Indicadores principais">
      <article><span>Pedidos</span><strong id="orders">—</strong><small id="orderValue">—</small></article>
      <article><span>Notas fiscais</span><strong id="invoices">—</strong><small id="invoiceValue">—</small></article>
      <article><span>Vínculos por item</span><strong id="links">—</strong><small>Pedido ↔ nota fiscal</small></article>
      <article><span>Notas sem vínculo</span><strong id="unlinked">—</strong><small>Para acompanhamento</small></article>
    </section>
    <section class="layout">
      <article class="panel">
        <div class="panel-title"><div><span class="eyebrow">EVOLUÇÃO</span><h2>Pedidos por mês</h2></div>
          <label>Indicador<select id="metric"><option value="valor">Valor</option><option value="quantidade">Quantidade</option></select></label>
        </div>
        <div id="monthlyChart" class="bars" role="img" aria-label="Gráfico mensal de pedidos"></div>
      </article>
      <article class="panel">
        <span class="eyebrow">DISTRIBUIÇÃO</span><h2>Situação dos pedidos</h2>
        <div class="table-wrap"><table><thead><tr><th>Situação</th><th>Pedidos</th><th>Valor</th></tr></thead><tbody id="statusRows"></tbody></table></div>
      </article>
    </section>
    <section class="panel comparison">
      <span class="eyebrow">COMPARATIVO</span><h2>Pedidos e notas fiscais</h2>
      <div id="comparison" class="comparison-list"></div>
    </section>
    <p class="privacy" id="privacy"></p>
    <div id="error" class="error" role="alert" hidden></div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
